name: eGramSwaraj connectivity probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test public source access without credentials
        run: |
          python3 - <<'PY'
          import hashlib,json,sys,urllib.request
          targets=[('activity','https://egramswaraj.gov.in/activitySectionData.do?activityCd=131388325'),('plan','https://egramswaraj.gov.in/getActivityList.do?planCd=6086963&activityStts=0')]
          success=True
          for kind,url in targets:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PollmediaPublicRecords/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read(1048576)
                      value=json.loads(body)
                      valid=(isinstance(value,dict) and value.get('activityCd')==131388325 and value.get('plnUntCd')==10532) if kind=='activity' else isinstance(value,list)
                      print(json.dumps({'kind':kind,'status':response.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'valid':valid}))
                      success=success and valid
              except Exception as error:
                  print(json.dumps({'kind':kind,'error':str(error)}));success=False
          sys.exit(0 if success else 1)
          PY
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - name: Check the Windows HTTP client independently of the computer
        shell: pwsh
        run: |
          $client=[System.Net.Http.HttpClient]::new()
          $client.Timeout=[TimeSpan]::FromSeconds(20)
          $client.DefaultRequestHeaders.UserAgent.ParseAdd('PollmediaPublicRecords/1.0')
          $passed=$true
          foreach($url in @('https://egramswaraj.gov.in/activitySectionData.do?activityCd=131388325','https://egramswaraj.gov.in/getActivityList.do?planCd=6086963&activityStts=0')){
            try {
              $response=$client.GetAsync($url).GetAwaiter().GetResult()
              $response.EnsureSuccessStatusCode() | Out-Null
              $body=$response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              $data=$body | ConvertFrom-Json
              @{status=[int]$response.StatusCode;bytes=$body.Length;valid=($null -ne $data)} | ConvertTo-Json -Compress
              $response.Dispose()
            } catch { @{error=$_.Exception.Message} | ConvertTo-Json -Compress; $passed=$false }
          }
          $client.Dispose()
          if(-not $passed){exit 1}
